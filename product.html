<!doctype html>

<html>
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>product</h1>

<ul>
<li><a href="index.html">home</a></li>
<li><a href="designprocess.html">designprocess</a></li>
<li>product</li>
</ul>

<div id="homepage">

    <h2>SKINSYNC</h2>
    <p>Healthy Skin Starts Here</p>

    <button onclick="showAnalysis()">
        Let's Start
    </button>

</div>

<div id="analysis" style="display:none;">

    <h2>Skin Analysis</h2>

    <p>Select Your Skin Type</p>

    <select id="skinType">
        <option>Oily Skin</option>
        <option>Dry Skin</option>
        <option>Combination Skin</option>
        <option>Sensitive Skin</option>
    </select>

    <br><br>

    <p>Select Your Concern</p>

    <select id="concern">
        <option>Acne</option>
        <option>Dark Spots</option>
        <option>Dull Skin</option>
        <option>Large Pores</option>
    </select>

    <br><br>

    <button onclick="showResult()">
        Analyze
    </button>

</div>

<div id="result" style="display:none;">

    <h2>Your Recommendation ✨</h2>

    <p id="resultText"></p>

</div>

<script>

function showAnalysis(){
    document.getElementById("homepage").style.display = "none";
    document.getElementById("analysis").style.display = "block";
}

function showResult(){

    let skin = document.getElementById("skinType").value;
    let concern = document.getElementById("concern").value;

    let recommendation = "";

    if (skin === "Oily Skin" && concern === "Acne") {
        recommendation =
        "🧴 Salicylic Acid Cleanser<br>" +
        "💧 Oil-Free Gel Moisturizer<br>" +
        "☀️ Sunscreen SPF 50<br><br>" +
        "✨ Tip: Avoid heavy oil-based products.";
    }

    else if (skin === "Oily Skin" && concern === "Dark Spots") {
        recommendation =
        "🍊 Niacinamide Serum<br>" +
        "💧 Lightweight Moisturizer<br>" +
        "☀️ Sunscreen SPF 50<br><br>" +
        "✨ Tip: Use sunscreen consistently.";
    }

    else if (skin === "Oily Skin" && concern === "Dull Skin") {
        recommendation =
        "🍊 Vitamin C Serum<br>" +
        "💧 Gel Moisturizer<br>" +
        "☀️ Sunscreen SPF 50<br><br>" +
        "✨ Tip: Focus on brightening ingredients.";
    }

    else if (skin === "Oily Skin" && concern === "Large Pores") {
        recommendation =
        "🧴 Salicylic Acid Cleanser<br>" +
        "🍊 Niacinamide Serum<br>" +
        "💧 Gel Moisturizer<br><br>" +
        "✨ Tip: Keep pores clean and hydrated.";
    }

    else if (skin === "Dry Skin" && concern === "Acne") {
        recommendation =
        "🧴 Gentle Hydrating Cleanser<br>" +
        "💧 Ceramide Moisturizer<br>" +
        "☀️ Sunscreen SPF 50<br><br>" +
        "✨ Tip: Protect your skin barrier.";
    }

    else if (skin === "Dry Skin" && concern === "Dark Spots") {
        recommendation =
        "🍊 Vitamin C Serum<br>" +
        "💧 Rich Moisturizer<br>" +
        "☀️ Sunscreen SPF 50";
    }

    else if (skin === "Dry Skin" && concern === "Dull Skin") {
        recommendation =
        "🍊 Vitamin C Serum<br>" +
        "💧 Hydrating Moisturizer<br>" +
        "☀️ Sunscreen SPF 50<br><br>" +
        "✨ Tip: Increase hydration.";
    }

    else if (skin === "Dry Skin" && concern === "Large Pores") {
        recommendation =
        "🧴 Gentle Cleanser<br>" +
        "💧 Ceramide Moisturizer<br>" +
        "☀️ Sunscreen SPF 50";
    }

    else if (skin === "Combination Skin" && concern === "Acne") {
        recommendation =
        "🧴 Salicylic Acid Cleanser<br>" +
        "💧 Lightweight Moisturizer<br>" +
        "☀️ Sunscreen SPF 50";
    }

    else if (skin === "Combination Skin" && concern === "Dark Spots") {
        recommendation =
        "🍊 Niacinamide Serum<br>" +
        "💧 Moisturizer<br>" +
        "☀️ Sunscreen SPF 50";
    }

    else if (skin === "Combination Skin" && concern === "Dull Skin") {
        recommendation =
        "🍊 Vitamin C Serum<br>" +
        "💧 Moisturizer<br>" +
        "☀️ Sunscreen SPF 50";
    }

    else if (skin === "Combination Skin" && concern === "Large Pores") {
        recommendation =
        "🍊 Niacinamide Serum<br>" +
        "💧 Gel Moisturizer<br>" +
        "☀️ Sunscreen SPF 50";
    }

    else if (skin === "Sensitive Skin" && concern === "Acne") {
        recommendation =
        "🌿 Fragrance-Free Cleanser<br>" +
        "🌱 Centella Moisturizer<br>" +
        "☀️ Mineral Sunscreen";
    }

    else if (skin === "Sensitive Skin" && concern === "Dark Spots") {
        recommendation =
        "🌿 Gentle Brightening Serum<br>" +
        "🌱 Centella Moisturizer<br>" +
        "☀️ Mineral Sunscreen";
    }

    else if (skin === "Sensitive Skin" && concern === "Dull Skin") {
        recommendation =
        "🍊 Mild Vitamin C Serum<br>" +
        "🌱 Centella Moisturizer<br>" +
        "☀️ Mineral Sunscreen";
    }

    else {
        recommendation =
        "🌿 Gentle Cleanser<br>" +
        "💧 Moisturizer<br>" +
        "☀️ Sunscreen SPF 50";
    }

    document.getElementById("analysis").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("resultText").innerHTML =
        "<strong>Skin Type:</strong> " + skin +
        "<br><strong>Concern:</strong> " + concern +
        "<br><br>" +
        recommendation;
}

</script>

</body>
</html>
